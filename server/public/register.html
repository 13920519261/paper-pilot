<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>注册 PaperPilot 账号</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --line: #e3e6ea; --text: #1f2329;
    --muted: #6b7280; --brand: #2563eb; --brand-weak: #dbeafe;
    --ok: #059669; --bad: #dc2626; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.7 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { width: 100%; background: #0d1526; color: #fff; padding: 18px 24px;
    display: flex; align-items: center; justify-content: center; gap: 14px; }
  header .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  main { width: 100%; max-width: 420px; padding: 28px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px 26px; }
  .card .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  input { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font-size: 14px; font-family: inherit; background: #fff; color: var(--text); width: 100%; }
  input:focus { outline: 2px solid var(--brand-weak); border-color: var(--brand); }
  button { width: 100%; border: 0; background: var(--brand); color: #fff; border-radius: 8px;
    padding: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  button:hover { filter: brightness(1.06); }
  button[disabled] { opacity: .55; cursor: not-allowed; }
  .msg { margin: 12px 0 0; font-size: 13px; min-height: 22px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--bad); }
  .foot { color: var(--muted); font-size: 12.5px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">P</div>
  <h1>PaperPilot 账号注册</h1>
</header>
<main>
  <div class="card">
    <p class="sub">注册后即可在 Zotero 插件（设置 → PaperPilot）登录，免费使用官方 AI 模型。</p>
    <div class="field"><label>邮箱 *</label>
      <input id="r-email" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>密码 *（至少 8 位）</label>
      <input id="r-password" type="password" autocomplete="new-password" minlength="8" placeholder="不少于 8 位"></div>
    <div class="field"><label>确认密码 *</label>
      <input id="r-password2" type="password" autocomplete="new-password" placeholder="再输入一次"></div>
    <div class="field"><label>昵称（可选）</label>
      <input id="r-nickname" placeholder="怎么称呼你"></div>
    <button id="r-submit" type="button" onclick="submitRegister()">注 册</button>
    <button id="r-resend" type="button" onclick="resendVerify()" style="display:none;background:#eef2f7;color:#2563eb;">重新发送验证邮件</button>
    <div class="msg" id="r-msg"></div>
    <div class="foot">已有账号？直接在 Zotero → 设置 → PaperPilot 中登录即可。忘记密码点<a href="/forgot" style="color:#2563eb">这里</a>。</div>
  </div>
</main>
<script>
'use strict';
function $(id) { return document.getElementById(id); }
function msg(text, ok) {
  var el = $('r-msg'); el.textContent = text || '';
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') submitRegister();
});
var lastEmail = '';
function submitRegister() {
  var email = $('r-email').value.trim();
  var pw = $('r-password').value;
  var pw2 = $('r-password2').value;
  var nickname = $('r-nickname').value.trim();
  if (!email) return msg('请填写邮箱', false);
  if (pw.length < 8) return msg('密码至少 8 位', false);
  if (pw !== pw2) return msg('两次输入的密码不一致', false);
  var btn = $('r-submit');
  btn.disabled = true; btn.textContent = '注册中…';
  fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pw, nickname: nickname }),
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.ok) {
      lastEmail = email;
      var pending = j.user && j.user.status === 'pending';
      msg('✓ ' + (j.notice || '注册成功！请打开 Zotero → 设置 → PaperPilot，用该邮箱登录。'), true);
      btn.textContent = pending ? '✓ 已发送验证邮件' : '✓ 注册成功';
      if (pending) $('r-resend').style.display = '';
      ['r-email', 'r-password', 'r-password2', 'r-nickname'].forEach(function (id) { $(id).value = ''; });
    } else {
      msg('✗ ' + (j.error || '注册失败'), false);
      btn.disabled = false; btn.textContent = '注 册';
    }
  }).catch(function () {
    msg('✗ 网络异常，请稍后再试', false);
    btn.disabled = false; btn.textContent = '注 册';
  });
}
function resendVerify() {
  if (!lastEmail) return msg('请先在上方完成注册', false);
  var btn = $('r-resend');
  btn.disabled = true; btn.textContent = '发送中…';
  fetch('/api/auth/resend', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: lastEmail }),
  }).then(function (r) { return r.json(); }).then(function (j) {
    msg(j.ok ? ('✓ ' + (j.message || '验证邮件已重新发送')) : ('✗ ' + (j.error || '失败')), Boolean(j.ok));
    btn.disabled = false; btn.textContent = '重新发送验证邮件';
  }).catch(function () {
    msg('✗ 网络异常，请稍后再试', false);
    btn.disabled = false; btn.textContent = '重新发送验证邮件';
  });
}
</script>
</body>
</html>

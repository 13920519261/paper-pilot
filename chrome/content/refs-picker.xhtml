<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE window>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        xmlns:html="http://www.w3.org/1999/xhtml"
        title="PaperPilot · 参考文献一键入库"
        width="640" height="520">
  <script src="chrome://paperpilot/content/refs-picker.js"></script>
  <vbox flex="1" style="padding:12px;">
    <label id="pp-refs-title" value="" style="font-weight:bold;"/>
    <label id="pp-refs-sub" value="" style="color:#666;margin-top:2px;"/>
    <vbox id="pp-refs-list" flex="1" style="overflow-y:auto;border:1px solid #999;padding:8px;margin:8px 0;background:#fff;"/>
    <hbox style="gap:8px;align-items:center;">
      <html:button id="pp-refs-all">全选</html:button>
      <html:button id="pp-refs-none">清空</html:button>
      <spacer flex="1"/>
      <html:span id="pp-refs-count" style="color:#666;"></html:span>
      <html:button id="pp-refs-ok" style="font-weight:bold;">导入选中</html:button>
      <html:button id="pp-refs-cancel">取消</html:button>
    </hbox>
  </vbox>
</window>
